<svg xmlns="http://www.w3.org/2000/svg" width="800" height="14" viewBox="0 0 800 14" role="img" aria-label="neon divider">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <animate attributeName="x1" values="0%;20%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;80%;100%" dur="8s" repeatCount="indefinite"/>
      <stop offset="0%" stop-color="#593bfe" stop-opacity="0"/>
      <stop offset="30%" stop-color="#593bfe"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="70%" stop-color="#593bfe"/>
      <stop offset="100%" stop-color="#593bfe" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="6" width="800" height="2" rx="1" fill="url(#divGrad)" filter="url(#divGlow)"/>
  <circle cx="400" cy="7" r="3" fill="#a78bfa">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
