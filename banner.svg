<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="taqniamostakbal banner">
  <defs>
    <!-- Animated purple gradient: drifts left to right and back -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <animate attributeName="x1" values="0%;25%;0%" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;75%;100%" dur="14s" repeatCount="indefinite"/>
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="35%" stop-color="#2a1a6e"/>
      <stop offset="55%" stop-color="#593bfe"/>
      <stop offset="75%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Neon line gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#593bfe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#593bfe" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft radial glow -->
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#593bfe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#593bfe" stop-opacity="0"/>
    </radialGradient>

    <!-- Text glow -->
    <filter id="textGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot grid -->
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#a78bfa" fill-opacity="0.28"/>
    </pattern>

    <!-- Clip for the moving streak on the neon line -->
    <clipPath id="lineClip">
      <rect x="360" y="224" width="480" height="4" rx="2"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="#0d1117"/>
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <!-- Pulsing neon orbs -->
  <circle cx="180" cy="70" r="90" fill="url(#orbGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="260" r="110" fill="url(#orbGlow)">
    <animate attributeName="opacity" values="1;0.6;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="30" r="70" fill="url(#orbGlow)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Twinkling stars -->
  <g fill="#e9d5ff">
    <circle cx="120" cy="60" r="2"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="40" r="1.6"><animate attributeName="opacity" values="1;0.1;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="90" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="55" r="1.6"><animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="80" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="50" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="250" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="240" r="2"><animate attributeName="opacity" values="1;0.1;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="280" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="180" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Name -->
  <text x="600" y="152" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="#ffffff" filter="url(#textGlow)">taqniamostakbal</text>

  <!-- Roles -->
  <text x="600" y="192" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#c4b5fd">Builder by night</text>

  <!-- Neon line with a moving bright streak -->
  <rect x="360" y="224" width="480" height="4" rx="2" fill="url(#lineGrad)" filter="url(#softGlow)"/>
  <g clip-path="url(#lineClip)">
    <rect x="360" y="224" width="120" height="4" fill="#ffffff" fill-opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="-140 0;500 0;-140 0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
